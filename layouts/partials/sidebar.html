<aside class="sidebar">
  <div class="sidebar-header">
    <a href="{{ "" | relURL }}" class="sidebar-brand">
      <div class="brand-icon-wrapper">
        <span class="brand-icon">🌿</span>
      </div>
      <div class="brand-text-group">
        <span class="brand-title">Digital Garden</span>
        <span class="brand-subtitle">Utsab's Notes</span>
      </div>
    </a>
  </div>

  <div class="sidebar-search-box">
    <div class="search-input-wrapper">
      <svg class="search-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="search-input" placeholder="Search notes..." onkeyup="filterTree()" autocomplete="off" spellcheck="false">
      <kbd class="search-kbd">/</kbd>
    </div>
  </div>

  <div class="sidebar-explorer-header">
    <span class="explorer-label">EXPLORER</span>
    <button class="tree-toggle-all-btn" onclick="toggleAllFolders()" title="Toggle collapse/expand all">
      <span id="toggle-all-text">Collapse</span>
    </button>
  </div>

  <nav class="file-tree">
    {{ $vault := .Site.GetPage "section" "vault" }}
    {{ if $vault }}
      {{ partial "tree-node.html" (dict "node" $vault "current" .) }}
    {{ else }}
      <p class="empty-message">No notes found.</p>
    {{ end }}
  </nav>

  <div class="sidebar-footer">
    <span class="sidebar-footer-text">🌲 Everforest Digital Garden</span>
  </div>
</aside>
