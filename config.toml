baseURL = "https://Utsab-2010.github.io/Notes-Host/"
languageCode = "en-us"
title = "Utsab's Note Repository"
canonifyURLs = true

ignoreFiles = [
  "\\.obsidian",
  "\\.git"
]

[params]
  description = "A collection of technical notes, research logs, and digital garden entries."
  math = true

[frontmatter]
  lastmod = [":git", ":fileModTime", "lastmod", "date"]

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [["\\[", "\\]"], ["$$", "$$"]]
          inline = [["\\(", "\\)"], ["$", "$"]]

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "content"
    target = "static"
    excludeFiles = "**.md"

